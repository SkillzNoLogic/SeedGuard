plugins {
    id "architectury-plugin" version "3.5.170"
    id "dev.architectury.loom" version "1.17.493" apply false
    id "com.gradleup.shadow" version "9.6.1" apply false
}

def mc = findProperty("mc") ?: "1.20.1"
def vp = new Properties()
file("versions/${mc}.properties").withInputStream { vp.load(it) }
vp.each { k, v -> rootProject.ext.set(k as String, v) }

architectury {
    minecraft = vp.minecraft_version
}

allprojects {
    group = "dev.seedguard"
    version = "1.0.0+mc${vp.minecraft_version}"
}

subprojects {
    apply plugin: "dev.architectury.loom"
    apply plugin: "architectury-plugin"

    base { archivesName = "seedguard-${project.name}" }

    repositories {
        maven { url = "https://maven.neoforged.net/releases/" }
    }

    loom {
        silentMojangMappingsLicense()
    }

    dependencies {
        minecraft "net.minecraft:minecraft:${vp.minecraft_version}"
        mappings loom.officialMojangMappings()
    }

    java {
        sourceCompatibility = JavaVersion.toVersion(vp.java_version)
        targetCompatibility = JavaVersion.toVersion(vp.java_version)
    }

    tasks.withType(JavaCompile).configureEach {
        options.release = vp.java_version as int
        options.encoding = "UTF-8"
    }
}
