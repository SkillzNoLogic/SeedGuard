pluginManagement {
    repositories {
        maven { url = "https://maven.fabricmc.net/" }
        maven { url = "https://maven.architectury.dev/" }
        maven { url = "https://maven.minecraftforge.net/" }
        maven { url = "https://maven.neoforged.net/releases/" }
        gradlePluginPortal()
    }
}

// Choose the Minecraft target with -Pmc=<version>. See versions/*.properties.
def mc = startParameter.projectProperties.get("mc") ?: "1.20.1"
def props = new Properties()
file("versions/${mc}.properties").withInputStream { props.load(it) }

rootProject.name = "seedguard-mod"
include "common"
props.platforms.split(",").each { include it.trim() }
